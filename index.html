<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logaritma 3: Persamaan Logaritma dan Persamaan Eksponen — Lembar Kerja</title>
<style>
/* situs.css — tampilan "papan kelas" (Bagian U, dokumen/SPESIFIKASI-U-PAPAN.md), di atas dasar
   "kertas dan tinta" (Bagian T, dokumen/SPESIFIKASI-T-TAMPILAN.md).
   Satu-satunya berkas gaya situs: gaya.css (salinan ljk-web) tidak lagi digabung (T-0 butir d);
   aturan kotak jawaban dan rumus yang masih dipakai ditulis ulang di sini. Semua warna lewat
   token :root (T.2, U.2). HP dulu; layar lebar di bagian bawah. */
:root{
  color-scheme:light;
  --kertas:#F5F3EC; --permukaan:#FFFFFF; --catatan:#E7EFE9; --garis:#E2DED2; --garis-kotak:#727E76;
  --tinta-lembut:#55625C; --tinta:#1B2420; --aksen:#1F4D3F;
  --benar:#2D6A4F; --benar-latar:#E4EFE8; --koreksi:#A33A2A; --koreksi-latar:#F6E3DF;
  --coba:#8A5A00; --coba-latar:#F8EED9; --video:#2C3A34;
  --papan:#1F4D3F; --kapur:#F2CF5B; --kapur-lembut:#CFE0D7; --kayu:#8B6A44;
  --serif:Georgia,'Noto Serif',serif;
  --sans:system-ui,-apple-system,'Segoe UI','Noto Sans',sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --j1:4px; --j2:8px; --j3:12px; --j4:16px; --j5:24px; --j6:32px; --j7:48px; --j8:64px;
  --sudut-kotak:8px; --sudut-kontrol:10px; --sudut-kartu:14px;
  --sentuh:44px; --lebar-isi:1120px; --tepi:16px;
}

/* ------------------------------------------------------------------ dasar */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%; background:var(--papan)}
body{margin:0; background:var(--kertas); color:var(--tinta); font:16px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.2; margin:0 0 var(--j3)}
h2{font-size:22px}
a{color:inherit; text-underline-offset:3px}
:focus-visible{outline:2px solid var(--aksen); outline-offset:2px}
code{font:.92em var(--mono)}
sub{font-size:.72em}
.ikon{width:20px; height:20px; flex:none; vertical-align:middle}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.bungkus{max-width:calc(var(--lebar-isi) + 2*var(--tepi)); margin:0 auto; padding:0 var(--tepi)}
main.bungkus,.isi-papan{max-width:calc(760px + 2*var(--tepi)); padding-bottom:var(--j7)}
.samar{color:var(--tinta-lembut); font-size:14px}

/* ------------------------------------------------------- kepala dan kaki */
header.atas{border-bottom:1px solid var(--garis)}
header.atas .bungkus{display:flex; align-items:center; justify-content:space-between; gap:var(--j3); min-height:60px}
a.merek{display:inline-flex; align-items:center; gap:10px; font:600 18px/1.2 var(--serif); text-decoration:none; white-space:nowrap}
.logo{fill:var(--tinta); flex:none}
.logo .l3{fill:none; stroke:var(--aksen); stroke-width:1.5}
nav.menu{display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:var(--j1) var(--j4); min-width:0; font-size:15px}
nav.menu > a:not(.tombol){text-decoration:none; white-space:nowrap}
nav.menu > a:hover{text-decoration:underline}
.nama-anggota{display:inline-block; max-width:9rem; line-height:42px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.formulir-menu{margin:0}
footer.kaki{background:var(--papan); font-size:13px; color:var(--kapur-lembut)}
/* papan atas (U.3): kepala + jejak + judul di papan hijau berbingkai kayu */
.papan{background:var(--papan); color:var(--permukaan); border-bottom:6px solid var(--kayu)}
.papan header.atas{border:0}
.papan a.merek{color:var(--kapur)}
.papan .logo{fill:var(--kapur)}
.papan .logo .l3{stroke:var(--permukaan)}
.papan .tombol{color:inherit; border-color:currentColor}
.papan :focus-visible,footer.kaki :focus-visible{outline-color:var(--kapur)}
.isi-papan{padding-bottom:var(--j5)}
.isi-papan:empty{display:none}
.papan .jejak,.papan .ket-subbab,.papan .deskripsi-bab,.papan .pahlawan p{color:var(--kapur-lembut)}
.papan .deskripsi-bab{margin:0}
footer.kaki .bungkus{display:flex; justify-content:space-between; padding-block:var(--j5)}
h1.judul-halaman{font-size:30px; line-height:1.15; margin:var(--j5) 0 var(--j3)}
.jejak + h1.judul-halaman{margin-top:var(--j2)}
.jejak{margin-top:var(--j5); font-size:14px; color:var(--tinta-lembut)}

/* ------------------------------------------------------- tombol & isian */
button,.tombol{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--j2);
  min-height:var(--sentuh); padding:0 var(--j4); font:600 15px/1.2 var(--sans); color:var(--tinta);
  background:transparent; border:1px solid var(--tinta); border-radius:var(--sudut-kontrol);
  text-decoration:none; cursor:pointer}
button.utama,.tombol.utama{min-height:48px; padding:0 var(--j5); font-size:16px; background:var(--aksen); border-color:var(--aksen); color:var(--permukaan)}
button:disabled{cursor:default; opacity:.6}
button.utama:disabled{background:var(--tinta-lembut); border-color:var(--tinta-lembut); opacity:1}
button.halus,button.tautan,button.bahaya,.tombol.bahaya{
  border:0; background:none; padding:0 var(--j1); font-weight:400; color:var(--tinta-lembut); text-decoration:underline}
button.bahaya,.tombol.bahaya{color:var(--koreksi)}
.baris-tombol{display:flex; gap:var(--j3); flex-wrap:wrap; align-items:center; margin-top:var(--j4)}
.baris-tombol form{display:flex}
:where(input:not([type=hidden],[type=checkbox],[type=radio]),select,textarea){
  min-height:var(--sentuh); max-width:100%; padding:0 var(--j3); font:16px var(--sans); color:var(--tinta);
  background:var(--permukaan); border:1px solid var(--garis-kotak); border-radius:var(--sudut-kontrol)}
textarea{width:100%; padding:var(--j2) var(--j3); font:14px/1.45 var(--mono); resize:vertical}
input.cari{width:100%}

/* ----------------------------------------------------------- kartu & catatan */
.kartu{background:var(--permukaan); border:1px solid var(--garis); border-radius:var(--sudut-kartu); padding:18px; margin:var(--j4) 0}
.kartu h2{font-size:19px}
.kartu h2 a{text-decoration:none}
.kartu p{margin:var(--j2) 0}
.catatan{background:var(--catatan); border-radius:var(--sudut-kontrol); padding:var(--j3) 14px; margin:var(--j4) 0; font-size:15px}
.peringatan-merah{background:var(--koreksi-latar); color:var(--koreksi)}
.tanda-sembunyi{font:600 12px var(--sans); color:var(--coba); background:var(--coba-latar); border-radius:6px; padding:2px 8px; vertical-align:middle}

/* ---------------------------------------------------------- beranda & daftar (T.4.8) */
main.luas,.isi-papan.luas{max-width:calc(var(--lebar-isi) + 2*var(--tepi))}
.pahlawan{margin:var(--j6) 0 0}
.pahlawan h1{font-size:31px; line-height:1.15; letter-spacing:-.02em}
.pahlawan p{color:var(--tinta-lembut); margin:0 0 var(--j5)}
form.cari label{display:block; margin-bottom:var(--j2); font-size:14px; font-weight:600}
.isian-cari{position:relative; display:block}
.isian-cari .ikon{position:absolute; left:14px; top:15px; color:var(--tinta-lembut)}
.isian-cari input.cari{min-height:52px; padding-left:46px}
.kepala-bagian{display:flex; justify-content:space-between; align-items:baseline; gap:var(--j3); margin-top:var(--j7); padding-bottom:var(--j3); border-bottom:1px solid var(--garis)}
.kepala-bagian h2{margin:0}
.daftar-tautan{padding-left:1.1rem}
.daftar-tautan li{margin:var(--j1) 0}
.daftar-bab,ul.tahap-daftar,.daftar-pengelola,.daftar-kemajuan,.pilihan-pratinjau{list-style:none; padding:0; margin:0}
.daftar-bab a{display:grid; grid-template-columns:2.4em 1fr auto; align-items:center; column-gap:var(--j3);
  min-height:72px; padding:var(--j4) 0; border-bottom:1px solid var(--garis); text-decoration:none}
.daftar-bab a > *{grid-column:2}
.daftar-bab .angka{grid-column:1; grid-row:1 / 4}
.daftar-bab .panah{grid-column:3; grid-row:1 / 4; color:var(--tinta-lembut)}
.angka{font:15px var(--serif); color:var(--tinta-lembut); font-variant-numeric:tabular-nums}
.daftar-bab .nama,.tahap-daftar .nama{font:600 19px/1.25 var(--serif)}
.daftar-bab .sisi{font-size:13px; color:var(--tinta-lembut)}
.tahap-daftar a{display:flex; align-items:center; gap:var(--j3); min-height:72px; padding:var(--j3) 0; border-bottom:1px solid var(--garis); text-decoration:none}
.tahap-daftar li:first-child a{border-top:1px solid var(--garis)}
.tahap-daftar a[aria-disabled=true]{opacity:.55}
.tahap-daftar .angka{min-width:2em}
.tahap-daftar .nama{flex:1}
.tahap-daftar .sisi{font-size:13px; color:var(--tinta-lembut); text-align:right}
.tahap-daftar .panah{color:var(--tinta-lembut)}
.deskripsi-kartu{display:block; margin-top:2px; font:14px/1.45 var(--sans); color:var(--tinta-lembut)}
.deskripsi-bab{color:var(--tinta-lembut); margin:0 0 var(--j4)}
.keadaan-subbab{display:block; font:600 13px var(--sans); color:var(--tinta-lembut)}
.k-selesai{color:var(--benar)}
.k-sedang,.kemajuan-bab{color:var(--aksen)}
.k-tutup{color:var(--tinta-lembut); font-weight:400}

/* kemajuan anggota/pengunjung (T-5): kartu terakhir dikerjakan, garis bab, centang kolom samping */
.kartu-terakhir h2{margin:var(--j1) 0; font-size:22px}
.kartu-terakhir .samar{margin:0}
.kartu-terakhir progress.batang{margin-top:var(--j3)}
.lanjutkan-terakhir{display:flex; justify-content:space-between; align-items:center; min-height:var(--sentuh); margin-top:var(--j2); font-weight:600; text-decoration:none}
.daftar-bab progress.batang,.ringkas-bab + progress.batang{max-width:220px}
.ringkas-bab{margin-bottom:0}
.ringkas-bab + progress.batang{margin-bottom:var(--j4)}
.tombol.tombol-lanjutkan{padding:var(--j2) var(--j5)}
#ringkas-samping{margin:var(--j3) 0 0; font-size:13px}
.daftar-samping li a::before{content:""; display:inline-block; width:1.4em; color:var(--benar)}
.daftar-samping li.selesai a::before{content:"✓"}
.daftar-samping li.belum-terbuka a{color:var(--tinta-lembut)}
.topik-tutup{margin:var(--j4) 0}
.ket-isi{font-size:13px; margin-left:var(--j3)}
.video-dulu{margin:var(--j4) 0}
.video-dulu h3{margin-top:0}
.daftar-tes{margin-top:var(--j4)}
.sesudah-unit{display:block; font:13px var(--sans); color:var(--tinta-lembut)}
.cara-belajar{margin-top:var(--j7)}
.cara-belajar ol{list-style:none; counter-reset:cara; display:grid; gap:var(--j4); padding:0; margin:var(--j4) 0 0}
.cara-belajar li{counter-increment:cara; display:grid; grid-template-columns:2.2em 1fr; column-gap:var(--j3); align-content:start; align-items:center}
.cara-belajar li span{grid-column:2}
.cara-belajar li::before{content:counter(cara); width:1.8em; height:1.8em; border-radius:50%; display:grid; place-items:center; background:var(--papan); color:var(--kapur); font:600 15px var(--sans)}
.cara-belajar li span{font-size:15px; color:var(--tinta-lembut)}
.tentang-situs{margin-top:var(--j6)}
.tentang-situs p{margin:0 0 var(--j2)}
@media (min-width:960px){.cara-belajar ol{grid-template-columns:repeat(4,1fr)}}
.lencana-tes{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--catatan); font:600 12px var(--sans); white-space:nowrap}
.daftar-samping li.tes-unit{margin-top:var(--j2); border-top:1px solid var(--garis)}
.topik-tutup h3{margin-top:0}
.daftar-samping [aria-current]::before{content:"•"; color:var(--aksen)}

/* ------------------------------------------------------------ halaman subbab (T.5) */
.ke-bab{display:inline-flex; align-items:center; gap:2px}
.ket-subbab{margin:0; font-size:14px; color:var(--tinta-lembut)}
.video-subbab{margin-top:var(--j5)}
.video-subbab .samar{margin:0; font-size:13px}
.bagian{margin-top:var(--j6)}
.bagian .kepala-bagian{margin:0; padding:0; border:0}
figure.video{margin:0 0 var(--j2); aspect-ratio:16/9; width:100%; border-radius:var(--sudut-kartu); overflow:hidden; background:var(--video)}
.putar-video{position:relative; width:100%; height:100%; border:0; border-radius:0}
.sampul-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.tombol-putar{position:relative; display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:50%; background:var(--kapur); color:var(--tinta)}
.tombol-putar .ikon{width:24px; height:24px}
figure.video iframe{display:block; width:100%; height:100%; border:0}
figure.video noscript a{color:var(--permukaan)}
.panel > figure.video-tingkat{margin:0 0 var(--j4)}
.baris-video{justify-content:flex-start; gap:14px; min-height:64px; padding:var(--j2); text-align:left; font-weight:400;
  background:var(--permukaan); border:1px solid var(--garis); border-radius:var(--sudut-kartu)}
.blok-video{position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none; width:72px; height:44px; border-radius:var(--sudut-kotak); background:var(--video); color:var(--kapur)}
.blok-video .ikon{position:relative; width:16px; height:16px; filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
.teks-video b{display:block; font-size:15px}
.teks-video .samar{font-size:13px}
.ket-penggaris{margin:0 0 var(--j4)}
.kolom-samping{display:none}
.daftar-samping ol{list-style:none; padding:0; margin:var(--j3) 0 0}
.daftar-samping .samar{margin:0; font-size:13px}
.judul-samping{margin:2px 0 0; font:600 22px/1.25 var(--serif)}
.judul-samping a{text-decoration:none}
.daftar-samping li a{display:block; padding:10px var(--j3); border-radius:var(--sudut-kontrol); text-decoration:none; font-size:15px}
.daftar-samping [aria-current]{background:var(--catatan); font-weight:600}
#ulangi-samping{margin-top:var(--j5)}
#ulangi-samping button{color:var(--tinta)}
#ulangi-samping p{margin:var(--j1) 0 0; font-size:13px}

/* penggaris tingkat soal (T.4.4); tetap tab: role=tab, aria-selected, aria-disabled */
.tab-tahap{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); align-items:start; gap:6px; margin:var(--j4) 0 var(--j2)}
.tab-tahap button{display:block; min-height:var(--sentuh); padding:0 0 var(--j1); border:0; border-radius:0; text-align:left; font-size:13px; font-weight:500}
.tab-tahap button::before{content:""; display:block; height:4px; border-radius:2px; margin-bottom:var(--j2); background:var(--garis-kotak)}
.tab-tahap .lencana-tahap{display:block; font-size:12px; font-weight:400; color:var(--tinta-lembut)}
.tab-tahap .selesai::before{background:var(--tinta)}
.tab-tahap .selesai .nama-tahap{font-weight:600}
.tab-tahap [aria-selected=true]::before{background:var(--aksen)}
.tab-tahap [aria-selected=true] .nama-tahap{color:var(--aksen); font-weight:700}
.tab-tahap .terkunci{cursor:not-allowed}
.tab-tahap .terkunci::before{background:var(--garis)}
.tab-tahap .terkunci .nama-tahap{color:var(--tinta-lembut)}

/* ---------------------------------------------------------------- latihan (T.4.5) */
.isi-panel{display:grid; gap:var(--j3)}
.isi-panel > .kartu{margin:0}
.butir > * + *{margin-top:var(--j4)}
.kepala-kartu{width:100%; min-height:28px; padding:0; gap:10px; justify-content:flex-start; border:0; border-radius:0; font-weight:400; cursor:default}
.ciut .kepala-kartu,.tuntas .kepala-kartu{cursor:pointer}
.no-butir{display:inline-flex; align-items:center; justify-content:center; flex:none; min-width:28px; height:28px; padding:0 6px;
  border-radius:6px; background:var(--aksen); color:var(--permukaan); font:700 14px var(--sans); font-variant-numeric:tabular-nums}
.urutan{font-size:14px; color:var(--tinta-lembut)}
.poin{display:inline-flex; align-items:center; gap:6px; margin-left:auto; font-size:14px; color:var(--tinta-lembut); font-variant-numeric:tabular-nums}
.poin .ikon{width:16px; height:16px}
.poin.benar{color:var(--benar)}
.poin.salah{color:var(--koreksi)}
.soal{font-size:17px; line-height:1.55}
.tak-dinilai{font-size:14px; color:var(--tinta-lembut)}
.label-jawab{margin-bottom:-8px; font-size:13px; color:var(--tinta-lembut)}
.butir .baris-tombol .utama{flex:1}
/* sudah dijawab, diciutkan: satu baris yang bisa dibuka lagi */
.butir.ciut{padding:var(--j3) var(--j4); min-height:52px; border-radius:var(--sudut-kontrol)}
.butir.ciut > :not(.kepala-kartu),.ciut .dari{display:none}
.ciut .no-butir{min-width:26px; height:26px; background:none; color:var(--tinta); border:1px solid var(--garis-kotak)}
.ciut .urutan{color:var(--tinta); font-size:15px}
.sisa-soal{margin:var(--j4) 0 0; font-size:14px; color:var(--tinta-lembut); text-align:center}
.sisa-soal:empty{display:none}
.ajakan{background:var(--catatan); border-radius:var(--sudut-kontrol); padding:var(--j3) 14px; margin:var(--j4) 0}
.ajakan p{margin:0 0 6px}
.ringkas-tahap{font-weight:600; margin:var(--j4) 0; padding:var(--j3) 14px; border-radius:var(--sudut-kontrol); background:var(--catatan); color:var(--aksen)}
.ringkas-tahap:empty{display:none}
.baris-lanjut{display:flex; justify-content:flex-end; margin:var(--j4) 0}
.baris-tombol.ulangi{justify-content:center; margin:var(--j5) 0}

/* kotak jawaban (dibuat kotak.js) — T.4.3 */
.jawaban{display:flex; flex-direction:column; gap:var(--j3); margin-top:var(--j4)}
.baris-jawab{background:var(--kertas); border-radius:var(--sudut-kontrol); padding:14px 12px}
.baris-jawab > .label{margin-bottom:var(--j2); font:italic 15px var(--serif); color:var(--tinta-lembut)}
.gulir{overflow-x:auto; padding-bottom:var(--j1)}
.blok{display:inline-flex; align-items:center; gap:6px; font-size:18px}
.blok.bersuku{flex-wrap:wrap; row-gap:var(--j2)}
.suku{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.blok .tanda-mat,.blok .var,.akar-tanda{font-family:var(--serif)}
.blok .var{font-style:italic}
.sel{display:inline-flex; align-items:center; gap:3px}
.kotak,.tanda{
  width:34px; height:46px; min-height:0; padding:0; text-align:center; font:20px/1 var(--sans); font-variant-numeric:tabular-nums;
  color:var(--tinta); background:var(--permukaan); border:1px solid var(--garis-kotak); border-radius:var(--sudut-kotak)}
.kotak:focus{border:2px solid var(--tinta)}
.tanda{width:26px; background:var(--catatan); color:var(--tinta-lembut)}
.tanda:not([aria-pressed=true]){font-size:0}
/* warna ± wajib: kotak.js membuat warna tombolnya transparent */
.tanda:not([aria-pressed=true])::after{content:"±"; font-size:17px; color:var(--tinta-lembut)}
.tanda[aria-pressed=true]{color:var(--tinta)}
.pecah-blok{display:inline-flex; flex-direction:column; align-items:center; gap:5px}
.pecah-blok .garis{height:2px; width:100%; min-width:4.6rem; background:var(--tinta)}
.kisi-kotak{display:inline-grid; gap:6px}
.kurung{align-self:stretch; width:10px; border:2px solid var(--tinta)}
.kurung.kiri{border-right:0; border-radius:3px 0 0 3px}
.kurung.kanan{border-left:0; border-radius:0 3px 3px 0}
.bulatan{display:inline-flex; flex-wrap:wrap; gap:var(--j2)}
.bulatan button{width:46px; height:46px; padding:0; border-radius:50%; border-color:var(--garis-kotak); background:var(--permukaan)}
.pg-daftar{display:flex; flex-direction:column; gap:var(--j2)}
.pg-daftar button{justify-content:flex-start; gap:var(--j3); width:100%; padding:var(--j2) var(--j3); text-align:left;
  font-weight:400; line-height:1.4; border-color:var(--garis-kotak); background:var(--permukaan)}
.pg-daftar [aria-pressed=true]{border:2px solid var(--tinta)}
.huruf{display:inline-flex; align-items:center; justify-content:center; flex:0 0 2rem; height:2rem; border-radius:50%;
  border:1px solid var(--garis-kotak); font-weight:700; font-size:14px}
.bulatan [aria-pressed=true],.pg-daftar [aria-pressed=true] .huruf{background:var(--tinta); border-color:var(--tinta); color:var(--permukaan)}
.kotak.benar,.tanda.benar,.bulatan .benar,.pg-daftar .benar{border:2px solid var(--benar); background:var(--benar-latar)}
.kotak.salah,.tanda.salah,.bulatan .salah,.pg-daftar .salah{border:2px solid var(--koreksi); background:var(--koreksi-latar)}

/* umpan balik dan pembahasan: ikon + kata, tidak pernah warna saja */
.wadah-balik:empty{margin-top:0}
.wadah-balik > * + *{margin-top:var(--j3)}
.balik{display:flex; gap:10px; align-items:flex-start; padding:var(--j3) 14px; border-radius:var(--sudut-kontrol); font-size:15px}
.balik .ikon{margin-top:2px}
.balik.coba{background:var(--coba-latar); color:var(--coba)}
.balik.benar{background:var(--benar-latar); color:var(--benar)}
.balik.salah{padding:0; color:var(--koreksi)}
.kunci-tampil{padding:var(--j3); background:var(--kertas); border-radius:var(--sudut-kontrol)}
.kunci-tampil .samar{margin:0 0 6px; font-size:13px}
.kunci-baris{display:inline-block; padding:6px var(--j3); background:var(--benar-latar); border:2px solid var(--benar); border-radius:var(--sudut-kotak)}
/* pembahasan = papan kecil (U.3); isi markah yang berlatar terang dibuat bening di atas papan */
.pembahasan{background:var(--papan); border-radius:var(--sudut-kartu); color:var(--permukaan)}
.pembahasan summary{display:flex; align-items:center; min-height:var(--sentuh); padding:0 14px; font-size:15px; font-weight:600; color:var(--kapur); cursor:pointer}
.pembahasan :focus-visible{outline-color:var(--kapur)}
.pembahasan blockquote,.pembahasan th,.pembahasan pre{background:none}
.pembahasan .isi{padding:0 14px 14px; font:17px/1.75 var(--serif)}

/* hasil Exit Ticket, blok selesai, ajakan masuk (T.4.7) */
.label-hasil{font-size:14px; font-weight:600; color:var(--tinta-lembut)}
.kartu .skor-exit{margin:0; font-size:18px; color:var(--tinta-lembut)}
.skor-exit b{font:600 56px/1 var(--serif); color:var(--tinta); font-variant-numeric:tabular-nums}
.deret-ljk{display:flex; flex-wrap:wrap; gap:var(--j3); margin:var(--j4) 0}
.deret-ljk > span{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--tinta-lembut)}
.titik{display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--tinta)}
.titik.salah{background:none; border:2px solid var(--koreksi); color:var(--koreksi)}
.titik .ikon{width:12px; height:12px}
.daftar-hasil{list-style:none; margin:0; padding:0}
.daftar-hasil li{display:flex; align-items:center; gap:var(--j3); min-height:52px; border-top:1px solid var(--garis)}
.daftar-hasil .halus{margin-left:auto}
.daftar-hasil .halus + .poin{margin-left:0}
.blok-selesai,.ajakan-masuk{margin-top:var(--j4); padding:var(--j5) 18px; border-radius:var(--sudut-kartu); text-align:center}
.blok-selesai{background:var(--catatan)}
.blok-selesai h3{font-size:22px; text-align:left}
.blok-selesai > p:first-of-type,.ajakan-masuk p{margin-top:0; text-align:left}
.blok-selesai .tombol,.ajakan-masuk .tombol{width:100%}
.blok-selesai .halus{margin-top:var(--j3)}
.blok-selesai .samar{margin:var(--j2) 0 0; font-size:13px}
.ajakan-masuk{border:1px solid var(--garis)}

/* teks yang disusun server (layanan/markah.py, latex.py) */
.markah p{margin:6px 0}
.markah ul{margin:var(--j1) 0; padding-left:1.15rem}
.markah blockquote{margin:var(--j2) 0; padding:6px var(--j3); border-left:3px solid var(--garis-kotak); background:var(--catatan)}
.markah .subjudul{font-weight:700}
pre.sketsa{overflow-x:auto; padding:var(--j2); font:13px/1.35 var(--mono); background:var(--permukaan); border:1px solid var(--garis); border-radius:var(--sudut-kotak)}
.gulir-tabel{overflow-x:auto; margin:6px 0}
.gulir-tabel table{border-collapse:collapse; font-size:15px}
.gulir-tabel th,.gulir-tabel td{border:1px solid var(--garis); padding:var(--j1) var(--j2); text-align:center}
.gulir-tabel th{background:var(--catatan)}
/* P-1: tabel pembahasan terstruktur (Langkah | Alasan / teori) di papan: aturan di atas menimpa latar bening
   .pembahasan th (kekhususan sama, letak sesudahnya) sehingga kapur di atas latar terang; sel rata kiri */
.pembahasan .gulir-tabel th{background:none}
.pembahasan .gulir-tabel th,.pembahasan .gulir-tabel td{text-align:left; vertical-align:top}
.rms{font-family:var(--serif); font-style:italic}
.rms .tegak,.rms sup,.rms sub,.rms .pecah,.rms .mat,.rms .kasus,.rms .lim{font-style:normal}
.rms sup,.rms sub{font-size:.72em}
.rms.blok{display:block; text-align:center; margin:.35em 0}
.rms .garis-atas{text-decoration:overline}
.rms .pecah{display:inline-block; vertical-align:middle; text-align:center; margin:0 .15em}
.rms .pecah > span{display:block; padding:0 .25em}
.rms .pecah > span:first-child{border-bottom:1.4px solid}
.rms .binom > span:first-child{border-bottom:0}
.rms .akar{display:inline-flex; align-items:stretch}
.rms .akar > .isi{border-top:1.4px solid; padding:0 .2em; margin-top:.12em}
.rms .mat,.rms .kasus{display:inline-flex; align-items:center; vertical-align:middle}
.rms .mat > .kisi{display:inline-grid; gap:.1em .6em; padding:.15em .3em}
.rms .mat > .kisi > span{text-align:center}
.rms .susun > .kisi{text-align:left}
.rms .mat > .kurung{align-self:stretch; width:.3em; border:1.6px solid; border-left:0; border-right:0; border-radius:0}
.rms .mat > .kurung.kiri{border-left:1.6px solid}
.rms .mat > .kurung.kanan{border-right:1.6px solid}
.rms .mat > .kurung.bulat{border-radius:70% / 50%}
.rms .mat > .kurung.kurawal{border-radius:40% / 25%}
.rms .mat > .kurung.garis{width:0; border-top:0; border-bottom:0}
/* 'lim' dengan syaratnya di bawah tulisan lim (masukan pemilik 2026-09-19) */
.rms .lim{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .18em}
.rms .lim > .bawah{font-size:.7em; white-space:nowrap}
/* kisi matriks rumus.js: banyak kolom lewat data-kolom (CSP melarang style= sebaris) */
.kisi[data-kolom="1"]{grid-template-columns:repeat(1,auto)}
.kisi[data-kolom="2"]{grid-template-columns:repeat(2,auto)}
.kisi[data-kolom="3"]{grid-template-columns:repeat(3,auto)}
.kisi[data-kolom="4"]{grid-template-columns:repeat(4,auto)}
.kisi[data-kolom="5"]{grid-template-columns:repeat(5,auto)}
.kisi[data-kolom="6"]{grid-template-columns:repeat(6,auto)}
.kisi[data-kolom="7"]{grid-template-columns:repeat(7,auto)}
.kisi[data-kolom="8"]{grid-template-columns:repeat(8,auto)}
.kisi[data-kolom="9"]{grid-template-columns:repeat(9,auto)}
.kisi[data-kolom="10"]{grid-template-columns:repeat(10,auto)}
.kisi[data-kolom="11"]{grid-template-columns:repeat(11,auto)}
.kisi[data-kolom="12"]{grid-template-columns:repeat(12,auto)}

/* ------------------------------------------------------------ akun & kemajuan */
dl.data-akun{display:grid; grid-template-columns:auto 1fr; gap:6px var(--j4); margin:var(--j3) 0; font-size:15px}
dl.data-akun dt{color:var(--tinta-lembut)}
dl.data-akun dd{margin:0; overflow-wrap:anywhere}
.daftar-kemajuan li{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px var(--j3); padding:var(--j2) 0; border-top:1px solid var(--garis)}
.daftar-kemajuan li.selesai span:first-child::after{content:" ✓"; color:var(--benar)}
progress.batang{display:block; flex-basis:100%; width:100%; height:6px; margin-top:var(--j1); border:0; border-radius:3px;
  -webkit-appearance:none; appearance:none; background:var(--garis); accent-color:var(--aksen)}
progress.batang::-webkit-progress-bar{background:var(--garis); border-radius:3px}
progress.batang::-webkit-progress-value{background:var(--aksen); border-radius:3px}
progress.batang::-moz-progress-bar{background:var(--aksen); border-radius:3px}

/* -------------------------------------------------------------- layar lebar */
@media (max-width:959px){.lebar{display:none!important}}
@media (max-width:359px){header.atas .bungkus,nav.menu{gap:var(--j2)} a.merek{gap:6px; font-size:15px} nav.menu{font-size:14px} nav.menu .tombol{padding:0 10px}}
@media (max-width:599px){.tab-tahap .lencana-tahap{min-height:2.5em}}
@media (min-width:600px){
  :root{--tepi:24px}
  .daftar-bab{display:grid; grid-template-columns:1fr 1fr; gap:var(--j4); margin-top:var(--j4)}
  .daftar-bab a{display:block; min-height:148px; padding:22px; background:var(--permukaan); border:1px solid var(--garis); border-radius:var(--sudut-kartu)}
  .daftar-bab a > *{display:block}
  .daftar-bab .nama{margin:var(--j2) 0 var(--j1); font-size:22px}
  .daftar-bab .panah{display:none}
  .daftar-bab .deskripsi-kartu{margin-bottom:var(--j1)}
}
@media (min-width:960px){
  :root{--tepi:32px}
  header.atas .bungkus{min-height:68px}
  a.merek{font-size:20px}
  h1.judul-halaman{font-size:40px; line-height:1.1}
  .pahlawan h1{font-size:48px; line-height:1.08}
  h2{font-size:26px}
  .hanya-hp{display:none!important}
  .beranda-atas{display:grid; grid-template-columns:7fr 5fr; gap:var(--j8); align-items:end}
  .pahlawan{margin-top:var(--j7); max-width:760px}
  .daftar-bab{grid-template-columns:repeat(3,1fr)}
  .tata-subbab{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:56px; align-items:start}
  .kolom-samping{display:block; margin-top:var(--j5)}
  .ket-subbab{font-size:15px}
  .kartu{padding:var(--j5)}
  .soal{font-size:18px}
  .kotak{width:38px; height:50px; font-size:22px}
  .tanda{width:28px; height:50px}
  .tab-tahap{gap:var(--j3)}
  .tab-tahap button{font-size:15px}
  .tab-tahap .lencana-tahap{font-size:13px}
  .tombol-putar{width:76px; height:76px}
  .isi-panel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .isi-panel > *{grid-column:1 / -1}
  .isi-panel > .ciut{grid-column:auto}
  .no-butir{min-width:30px; height:30px}
  .baris-jawab{display:flex; align-items:center; gap:var(--j3); padding:var(--j4)}
  .baris-jawab > .label{margin:0}
  .butir .baris-tombol .utama{flex:none; padding:0 40px}
}

/* gambar soal (Bagian G): kartu putih "kertas" di papan, garis hitam SVG tetap terbaca di kedua tema */
.gambar-soal{display:block; max-width:520px; margin:10px 0 4px; padding:8px; background:#fff; border-radius:8px}
.gambar-soal img{display:block; width:100%; height:auto}

/* lks.css — rupa lembar LKS kertas (K-12) di atas situs.css (token warna dan kotak jawaban dari situs). */
:root{--meja:#E4E0D6; --lembar:#FFFFFF; --garis-lembar:#D9D4C7; --pita:#2F5D50; --pita-tua:#1F4D3F}
html,body{background:var(--meja)}
.lks{padding:var(--j5) 0 var(--j7)}
.kertas{max-width:840px; margin:0 auto; background:var(--lembar); padding:40px 52px 56px;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.10); border-radius:4px}
.lks-kepala{padding-bottom:var(--j4); border-bottom:3px double var(--pita-tua)}
.lks-kepala h1{font-size:32px; margin:var(--j1) 0 var(--j3)}
.lks-status{display:inline-block; margin:0; padding:4px 12px; border:1.5px solid var(--kayu); border-radius:999px;
  font:600 13px var(--sans); color:#6E5233; background:#FBF4E8}
/* identitas siswa (K-32): Nama | Kelas | No. Absen; di HP bertumpuk */
.lks-identitas{display:grid; grid-template-columns:1fr 9em 6em; gap:var(--j2) var(--j3); margin:var(--j4) 0 0;
  padding:var(--j3) var(--j4) var(--j4); border:1.5px solid var(--garis-lembar); border-radius:var(--sudut-kontrol)}
.lks-identitas legend{padding:0 6px; font:600 13px var(--sans); color:var(--pita-tua)}
.lks-identitas label{display:flex; flex-direction:column; gap:4px; font:600 13px var(--sans); color:var(--tinta-lembut)}
.lks-identitas input{width:100%; min-width:0; box-sizing:border-box; padding:8px 10px; font:16px var(--sans);
  border:1px solid var(--garis-kotak); border-radius:var(--sudut-kotak); background:var(--permukaan); color:inherit}
.lks-identitas input[readonly]{background:var(--catatan)}
/* simpan (L-4): Unduh/Buka simpanan di sampul; tombol Simpan menempel di ujung kanan menu; waktu cetak hanya di kertas */
.lks-simpanan{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:var(--j2);
  padding-top:var(--j3); border-top:1px dashed var(--garis-lembar)}
.lks-simpanan p{flex:1 1 14em; margin:0; font-size:13px}
.lks-menu .lks-tombol-simpan{flex:none; display:inline-flex; align-items:center; box-sizing:border-box; min-height:36px; margin:0;
  padding:0 14px; border:1px solid var(--pita); border-radius:999px; background:var(--pita); color:#fff; font:600 14px var(--sans);
  white-space:nowrap}
.lks-waktu-cetak{display:none}
.lks-label{display:block; margin:0; font:600 12px/1.4 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-lembut)}
.lks-bagian{padding-top:var(--j5); scroll-margin-top:var(--j3)}

/* tampilan dua tingkat (L-1e): menu per subbab, tab per bagian, satu soal per layar; cetak = semua */
@media screen{.tersembunyi{display:none!important}}
.lks-menu{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; margin:0 -8px; padding:10px 8px;
  background:var(--lembar); border-bottom:1px solid var(--garis-lembar); font:600 14px var(--sans)}
.lks-menu-jalur{position:relative; flex:1; min-width:0; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:thin}
@media (min-width:700px){   /* layar lebar: semua tampak dalam satu baris, tanpa geser; pindah baris hanya bila tetap tidak muat */
  .lks-menu-jalur{flex-wrap:wrap; overflow:visible; gap:4px}
  .lks-menu .lks-menu-jalur a{padding:0 9px; font-size:13px} .lks-menu .lks-tombol-simpan{padding:0 12px; font-size:13px}
}
.lks-menu a{flex:none; display:inline-flex; align-items:center; box-sizing:border-box; min-height:36px; margin:0; padding:0 12px;
  border:1px solid var(--garis-kotak); border-radius:999px; color:var(--tinta); text-decoration:none; line-height:1.2; white-space:nowrap}
.lks-menu a[aria-current=page]{background:var(--pita); border-color:var(--pita); color:#fff}
.lks-tab{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--j2)}
.lks-tab .tombol-kecil[aria-pressed=true]{background:var(--pita); border-color:var(--pita); color:#fff}
.lks-nomor{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 var(--j3)}
.lks-no{min-width:38px; height:38px; padding:0 8px; border:1.5px solid var(--garis-kotak); border-radius:8px; background:var(--lembar);
  font:600 14px var(--sans); color:var(--tinta)}
.lks-no.dikerjakan{background:var(--benar); border-color:var(--benar); color:#fff}
.lks-no[aria-current=step]{outline:3px solid var(--pita); outline-offset:2px}
.lks-pindah{display:flex; justify-content:space-between; gap:var(--j3); margin-top:var(--j4)}
.lks-pindah button:disabled{visibility:hidden}
.judul-subbab{font-size:24px; margin:0 0 var(--j3); padding-bottom:var(--j2); border-bottom:1px solid var(--garis-lembar)}

/* pita judul bagian, seperti LKS cetak */
.pita{display:inline-flex; align-items:center; margin:var(--j4) 0 var(--j2); font:700 18px/1.2 var(--sans); color:#fff}
.pita span{position:relative; padding:8px 22px 8px 18px; background:var(--pita); border-radius:999px 6px 6px 999px;
  box-shadow:inset 6px 0 0 var(--pita-tua)}
.pita.cek span{background:var(--kayu); box-shadow:inset 6px 0 0 #6E5233}
.lks-petunjuk{margin:0 0 var(--j3); font-size:14px; font-style:italic; color:var(--tinta-lembut)}

/* peta konsep berbentuk bagan */
.bagan{display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:var(--j2)}
.bagan-akar{padding:10px 26px; border:2px solid var(--pita-tua); border-radius:8px; font:700 18px/1.2 var(--serif); background:var(--catatan)}
.bagan-kata{font:italic 13px/1.2 var(--serif); color:var(--tinta-lembut); padding:10px 0; position:relative}
.bagan-kata::before{content:""; position:absolute; left:50%; top:0; bottom:0; border-left:1.5px solid var(--garis-kotak)}
.bagan-kata span{position:relative; z-index:1; padding:0 6px; background:var(--lembar)}
.bagan-cabang{list-style:none; margin:0; padding:var(--j3) 0 0; display:grid; gap:var(--j3); width:100%;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); border-top:1.5px solid var(--garis-kotak)}
.bagan-simpul{display:flex; flex-direction:column; align-items:center}
.bagan-judul{padding:8px 12px; border:1.5px solid var(--garis-kotak); border-radius:8px; font-weight:600; font-size:15px; background:var(--lembar); width:100%}
.bagan-simpul ul{margin:0; padding:8px 10px 8px 26px; text-align:left; font-size:14px; border:1px dashed var(--garis-lembar); border-radius:8px; width:100%}
.kata-kunci{margin-top:var(--j5); border:1.5px solid var(--pita-tua); border-radius:8px; overflow:hidden}
.kata-kunci-judul{margin:0; padding:6px 14px; background:var(--pita-tua); color:#fff; font-weight:700}
.kata-kunci ul{margin:0; padding:10px 14px; list-style:none; display:flex; flex-wrap:wrap; gap:6px 22px}
.kata-kunci li::before{content:"▪ "; color:var(--pita)}

/* soal bernomor seperti kertas */
.daftar-soal{margin:0; padding:0 0 0 2em; font:17px/1.7 var(--serif)}
.lks-soal{padding:var(--j3) 0 var(--j4)}
.lks-soal::marker{font-weight:700}
.lks-soal > * + *{margin-top:var(--j3)}
.lks-soal .baris-jawab{background:none; padding:4px 0; border-radius:0}
.lks-soal .jawaban::before{content:"Jawab:"; display:block; font:600 13px var(--sans); color:var(--tinta-lembut); margin-bottom:2px}
.baris-aksi{display:flex; flex-wrap:wrap; align-items:center; gap:var(--j3); font-family:var(--sans)}
.tombol-periksa{min-height:40px; padding:0 20px; background:var(--pita); border:1px solid var(--pita); color:#fff; font:600 15px var(--sans); border-radius:999px}
.tombol-periksa:disabled{background:var(--tinta-lembut); border-color:var(--tinta-lembut); opacity:.55}
.tombol-kecil{min-height:36px; padding:0 14px; background:var(--lembar); border:1px solid var(--garis-kotak); border-radius:999px; font:600 14px var(--sans); color:var(--tinta)}
.tombol-kecil[aria-pressed=true]{background:var(--tinta); color:#fff; border-color:var(--tinta)}
.baris-aksi .poin{margin-left:auto; font-size:14px; color:var(--tinta-lembut)}
.poin.benar{color:var(--benar)} .poin.salah{color:var(--koreksi)}
.ikon-teks{flex:none; width:20px; text-align:center; font-weight:700}
.balik.simpan{background:var(--catatan); color:var(--tinta)}
.wadah-balik{font-family:var(--sans)}
.gambar-soal{display:block}
.gambar-soal img{display:block; max-width:100%; height:auto}

/* grafik JavaScript (grafik_lks.js) */
.grafik-soal,.lab-lks{margin:var(--j3) 0 0}
.grafik-lks{display:block; width:100%; max-width:520px; height:auto; background:#fff; border:1px solid var(--garis-lembar); border-radius:6px;
  font:13px var(--serif)}
.grafik-lks .kisi line{stroke:#D6D1C4; stroke-width:1}
.grafik-lks .kisi-halus line{stroke:#EEEBE3; stroke-width:.8}
.grafik-lks .garis-sumbu{stroke:var(--tinta); stroke-width:1.5}

>(<i>x<\/i>)<\/sup><\/span> → f(x) = g(x); <span class=\"rms\"><i>a<\/i><sup><i>f<\/i>(<i>x<\/i>)<\/sup> = <i>b<\/i><\/span> → f(x) = log b : log a; ᵃlog f(x) = ᵃlog g(x) → f(x) = g(x), lalu cek f &gt; 0 dan g &gt; 0.","tanya":null,"jawab":null},{"teks":"Yang ditinggalkan video: lakukan sendiri langkah timbangannya di M2 dan M3, lalu buka lab untuk melihat mengapa ada jawaban yang dibuang.","tanya":null,"jawab":null}]},{"judul":"Dari akhir video: logaritma kedua ruas","gerak":{"jenis":"timbangan","baris":[["3ⁿ","2000",""],["log 3ⁿ","log 2000","log kedua ruas"],["n · log 3","log 2000","sifat pangkat"],["n","log 2000 : log 3","bagi kedua ruas dengan log 3"],["n","3,301 : 0,477","isi nilai log"],["n","≈ 6,92","hitung"]]},"video":null,"langkah":[{"teks":"Persamaan <span class=\"rms\">3<sup><i>n<\/i><\/sup> = 2000<\/span> seperti timbangan seimbang: kiri <span class=\"rms\">3<sup><i>n<\/i><\/sup><\/span>, kanan 2000. Kita boleh melakukan apa saja asal <strong>sama pada kedua ruas<\/strong>.","tanya":null,"jawab":null},{"teks":"Logaritma kedua ruas: log <span class=\"rms\">3<sup><i>n<\/i><\/sup><\/span> = log 2000. Timbangan bergoyang sebentar lalu seimbang lagi, karena kedua ruas diberi perlakuan yang sama.","tanya":"Perlakuan apa yang menurunkan n dari pangkat? Ketik 1 bila akar kedua ruas, 2 bila logaritma kedua ruas, 3 bila bagi kedua ruas dengan 3.","jawab":"2"},{"teks":"Sifat pangkat dari Subbab 2: log <span class=\"rms\">3<sup><i>n<\/i><\/sup><\/span> = n · log 3. Sekarang n tidak terkunci lagi; ia menjadi pengali.","tanya":null,"jawab":null},{"teks":"Bagi kedua ruas dengan log 3: n = log 2000 : log 3.","tanya":null,"jawab":null},{"teks":"Isi nilai log berpokok 10: log 2000 ≈ 3,301 dan log 3 ≈ 0,477 (dari tabel, kalkulator, atau soal).","tanya":null,"jawab":null},{"teks":"n ≈ 6,92, sama dengan hasil menaksir di Subbab 1, tetapi sekarang tanpa menebak. Pokok logaritma yang diambil boleh apa saja; log berpokok 10 dipilih karena nilainya mudah didapat.","tanya":"Hitung n = 3,301 : 0,477 sampai dua desimal (misalnya 5,25).","jawab":"6,92"},{"teks":"Bila pokoknya <strong>bisa disamakan<\/strong>, tidak perlu logaritma: <span class=\"rms\">2<sup><i>x<\/i> + 1<\/sup> = 8<sup><i>x<\/i> − 1<\/sup><\/span> → <span class=\"rms\">2<sup><i>x<\/i> + 1<\/sup> = 2<sup>3<i>x<\/i> − 3<\/sup><\/span> → x + 1 = 3x − 3 → x = 2. Logaritma kedua ruas dipakai bila pokok tidak bisa disamakan, misalnya <span class=\"rms\">5<sup><i>x<\/i><\/sup> = 40<\/span> → x = log 40 : log 5 ≈ 1,602 : 0,699 ≈ 2,29.","tanya":null,"jawab":null}]},{"judul":"Persamaan logaritma: gabungkan, ubah, cek","gerak":{"jenis":"timbangan","baris":[["²log(x+2) + ²log(x−1)","2",""],["²log((x+2)(x−1))","2","sifat hasil kali"],["(x+2)(x−1)","2² = 4","ubah ke bentuk pangkat"],["x² + x − 6","0","kurangi kedua ruas dengan 4"],["(x+3)(x−2)","0","faktorkan"],["x","2  (−3 dibuang)","cek syarat numerus"]]},"video":null,"langkah":[{"teks":"Persamaan: ²log(x + 2) + ²log(x − 1) = 2. <strong>Sebelum apa pun, catat syaratnya:<\/strong> x + 2 &gt; 0 dan x − 1 &gt; 0, jadi x &gt; 1.","tanya":null,"jawab":null},{"teks":"Gabungkan dengan sifat hasil kali: ²log((x + 2)(x − 1)) = 2.","tanya":null,"jawab":null},{"teks":"Ubah ke bentuk pangkat (definisi Subbab 1): (x + 2)(x − 1) = 2² = 4.","tanya":"²log B = 2 berarti B sama dengan berapa?","jawab":"4"},{"teks":"Kurangi kedua ruas dengan 4: x² + x − 6 = 0.","tanya":null,"jawab":null},{"teks":"Faktorkan: (x + 3)(x − 2) = 0, jadi x = −3 atau x = 2.","tanya":null,"jawab":null},{"teks":"x = −3 dibuang: x + 2 = −1 dan x − 1 = −4 negatif (melanggar x &gt; 1). Jawabannya hanya x = 2; cek: ²log 4 + ²log 1 = 2 + 0 = 2 ✓.","tanya":"Akar mana yang harus dibuang? Ketik akarnya.","jawab":"-3"},{"teks":"Pokok sama di kedua ruas, ᵃlog f(x) = ᵃlog g(x), langsung memberi f(x) = g(x), tetapi tetap cek <strong>kedua<\/strong> numerus. Ingat: akar negatif bisa sah (bila numerusnya tetap positif) dan akar positif bisa dibuang. Di lab, pilih persamaan (x − 4)(x − 6) = 8: akar mana yang dibuang, dan apakah ia negatif?","tanya":null,"jawab":null}]},{"judul":"Persamaan eksponen: tiga bentuk, dan sistem persamaan","gerak":null,"video":null,"langkah":[{"teks":"<strong>Bentuk 1, pokok bisa disamakan.<\/strong> Tulis kedua ruas dengan pokok yang sama, lalu samakan pangkatnya: <span class=\"rms\">2<sup><i>x<\/i> + 1<\/sup> = 8<sup><i>x<\/i> − 1<\/sup><\/span> → <span class=\"rms\">2<sup><i>x<\/i> + 1<\/sup> = 2<sup>3<i>x<\/i> − 3<\/sup><\/span> → x = 2.","tanya":null,"jawab":null},{"teks":"<strong>Bentuk 2, pokok tidak bisa disamakan.<\/strong> Ambil logaritma kedua ruas: <span class=\"rms\">5<sup><i>x<\/i><\/sup> = 40<\/span> → x · log 5 = log 40 → x = log 40 : log 5 ≈ 2,29. Pangkat yang berupa bentuk aljabar, misalnya <span class=\"rms\">5<sup>2<i>x<\/i> − 1<\/sup><\/span>, diperlakukan sama: (2x − 1) · log 5 = log 40.","tanya":null,"jawab":null},{"teks":"<strong>Bentuk 3, kuadrat terselubung.<\/strong> <span class=\"rms\">4<sup><i>x<\/i><\/sup> = (2<sup>2<\/sup>)<sup><i>x<\/i><\/sup> = (2<sup><i>x<\/i><\/sup>)<sup>2<\/sup> = <i>u<\/i><sup>2<\/sup><\/span>, jadi u² − 6u + 8 = 0 → u = 2 atau u = 4.","tanya":"Persamaan <span class=\"rms\">4<sup><i>x<\/i><\/sup> − 6 <span class=\"tegak\">·<\/span> 2<sup><i>x<\/i><\/sup> + 8 = 0<\/span>. Bila u = <span class=\"rms\">2<sup><i>x<\/i><\/sup><\/span>, maka <span class=\"rms\">4<sup><i>x<\/i><\/sup><\/span> sama dengan? Ketik 1 bila u², 2 bila 2u, 3 bila u + 2.","jawab":"1"},{"teks":"Kembalikan ke x: <span class=\"rms\">2<sup><i>x<\/i><\/sup> = 2<\/span> → x = 1; <span class=\"rms\">2<sup><i>x<\/i><\/sup> = 4<\/span> → x = 2. Bila ada nilai u yang negatif atau nol, buang, karena <span class=\"rms\">2<sup><i>x<\/i><\/sup><\/span> selalu positif.","tanya":null,"jawab":null},{"teks":"<strong>Sistem persamaan<\/strong> (dua peubah, misalnya x dan y): sederhanakan setiap persamaan dengan sifat dan definisi sampai menjadi persamaan biasa (misalnya x + 2y = 4 dari pokok yang disamakan), lalu selesaikan dengan substitusi atau eliminasi. Syarat numerus dan pokok tetap diperiksa di akhir.","tanya":null,"jawab":null}]},{"judul":"Bekal untuk semua soal di subbab ini","gerak":null,"video":null,"langkah":[{"teks":"Semua soal subbab ini bisa dijawab dengan <strong>delapan bekal<\/strong> berikut. Nomor soal yang memakainya ditulis di ujung (nomor di dalam bagiannya: Amati, Terbimbing, Uji, Kompleks, Cek), jadi kamu tahu harus kembali ke bekal mana bila tersangkut.","tanya":null,"jawab":null},{"teks":"<strong>Bekal 1, pokok sama.<\/strong> ᵃlog f(x) = ᵃlog g(x) → f(x) = g(x). Jangan mencoret “log” saja tanpa memeriksa: hasilnya harus membuat kedua numerus positif. (Amati 1–5; Contoh 1.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 2, syarat dulu, cek di akhir.<\/strong> Tulis syarat numerus (dan pokok bila berupa peubah) di awal; periksa setiap akar di akhir. Akar negatif bisa sah, akar positif bisa dibuang. (Amati 6–7; Uji 3; Terbimbing 1; Cek 1.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 3, gabungkan dengan sifat.<\/strong> Jumlah atau selisih logaritma berpokok sama digabung dulu (Subbab 2), lalu diubah ke bentuk pangkat. (Uji 1–2; Terbimbing 2; Cek 2–3.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 4, pokok berbeda.<\/strong> Ganti pokok supaya semua logaritma berpokok sama, lalu misalkan p = ᵃlog x: ²log x + ⁴log x = 6 → p + ½p = 6. (Terbimbing 3; Uji 6–7; Contoh 2.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 5, persamaan eksponen.<\/strong> Pokok bisa disamakan → samakan pangkat; tidak bisa → logaritma kedua ruas, lalu bulatkan sesuai permintaan. (Amati 8–10; Uji 4–5; Terbimbing 4; Cek 4.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 6, pemisalan u = aˣ.<\/strong> Ubah menjadi persamaan kuadrat dalam u; buang u ≤ 0; kembalikan ke x. (Terbimbing 5; Uji 8 dan 11–12; Contoh 3.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 7, sistem persamaan.<\/strong> Sederhanakan tiap persamaan menjadi bentuk biasa, selesaikan bersama, lalu cek syarat. (Uji 9–10 dan 13; Cek 5.)","tanya":null,"jawab":null},{"teks":"<strong>Bekal 8, soal kompleks.<\/strong> Tulis dulu modelnya dari keterangan (berantai <span class=\"rms\">3<sup><i>n<\/i><\/sup><\/span>, tabungan <span class=\"rms\">1,1<sup><i>n<\/i><\/sup><\/span>, obat <span class=\"rms\">400 <span class=\"tegak\">·<\/span> (<span class=\"pecah\"><span>1<\/span><span>2<\/span><\/span>)<sup><i>t<\/i>/6<\/sup><\/span>, koloni, level gim), susun persamaannya, selesaikan dengan bekal 5, dan bulatkan ke atas bila jawabannya harus bilangan bulat yang “melampaui”. (Soal Kompleks 1–5.)","tanya":null,"jawab":null}]}],"contoh":[{"soal":"Tentukan nilai <span class=\"rms\"><i>x<\/i><\/span> yang memenuhi ⁵log(3x − 1) = ⁵log(x + 7).","jadi":"Jadi, x = 4.","langkah":[["Syarat: 3x − 1 &gt; 0 dan x + 7 &gt; 0, jadi <span class=\"rms\"><i>x<\/i> &gt; <span class=\"pecah\"><span>1<\/span><span>3<\/span><\/span><\/span>","Numerus harus positif; catat di awal"],["3x − 1 = x + 7","Pokok sama: ᵃlog f = ᵃlog g → f = g"],["2x = 8, jadi x = 4","Selesaikan persamaan linear"],["Cek: 3 · 4 − 1 = 11 &gt; 0 dan 4 + 7 = 11 &gt; 0 ✓","Akar memenuhi syarat"]]},{"soal":"Tentukan nilai <span class=\"rms\"><i>x<\/i><\/span> yang memenuhi ²log x + ⁴log x = 6.","jadi":"Jadi, x = 16.","langkah":[["⁴log x = ²log x : ²log 4 = <span class=\"rms\"><span class=\"pecah\"><span>1<\/span><span>2<\/span><\/span><\/span> · ²log x","Ganti pokok ke 2; ²log 4 = 2"],["Misalkan p = ²log x: p + <span class=\"rms\"><span class=\"pecah\"><span>1<\/span><span>2<\/span><\/span><\/span>p = 6","Satu peubah lebih mudah"],["<span class=\"rms\"><span class=\"pecah\"><span>3<\/span><span>2<\/span><\/span><\/span>p = 6, jadi p = 4","Selesaikan"],["²log x = 4 → x = <span class=\"rms\">2<sup>4<\/sup><\/span> = 16; cek x &gt; 0 ✓","Definisi logaritma; syarat numerus"]]},{"soal":"Tentukan semua nilai <span class=\"rms\"><i>x<\/i><\/span> yang memenuhi <span class=\"rms\">9<sup><i>x<\/i><\/sup> − 4 <span class=\"tegak\">·<\/span> /* Pembuka (L-1f): kode halaman tersandi (aliran nilai_lks.js, nomor 0), dijalankan di dalam satu fungsi. */

    var garam = JSON.parse(document.getElementById("data-lks").textContent).garam, benih = [], i, j;
